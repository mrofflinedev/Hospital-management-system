{% extends 'base.html' %}

{% block title %}Add Doctor | AYUNDA HEALTH CENTER{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2>Register New Medical Doctor</h2>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-teal">Save Doctor Account</button>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
