{% extends 'base.html' %}

{% block title %}Book Appointment | AYUNDA HEALTH CENTER{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2>Book an Appointment</h2>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Confirm Booking</button>
        <a href="{% url 'patient_dashboard' %}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
