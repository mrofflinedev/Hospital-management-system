{% extends 'base.html' %}

{% block title %}{{ user_type }} Registration | AYUNDA HEALTH CENTER{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2>{{ user_type }} Registration</h2>
    </div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Create {{ user_type }} Account</button>
    </form>
</div>
{% endblock %}
